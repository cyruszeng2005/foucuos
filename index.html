<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FocusOS Design by 曾晨阳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter for premium digital visual style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            light: '#f5f5f7',
                            card: '#ffffff',
                            border: '#e5e5ea',
                            muted: '#86868b',
                            accent: '#0071e3',
                            darkText: '#1d1d1f'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Block pull-to-refresh & browser scrolling elastic effects */
        html, body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
        }
        /* Custom sleek light-scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f5f5f7;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d1d6;
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #acacb0;
        }
        /* Glassmorphism elements */
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        .no-scroll {
            overflow: hidden !important;
            touch-action: none;
        }
        /* Force minimum font-size on text inputs to block iOS/Android auto-zoom-in */
        textarea, input, select {
            font-size: 16px !important;
        }
        @media (min-width: 768px) {
            textarea, input, select {
                font-size: 14px !important;
            }
        }
        /* iOS Notch/Android safe-area layout fillers */
        .pb-safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe-top {
            padding-top: env(safe-area-inset-top, 0px);
        }
        .active-scale:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="bg-apple-light text-apple-darkText font-sans flex flex-col justify-between overflow-hidden h-[100dvh] w-full select-none">

<header class="glass border-b border-apple-border px-6 md:px-8 py-3 flex justify-between items-center z-30 no-select flex-shrink-0 pt-safe-top">
    <div class="flex items-center space-x-2.5">
        <div class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></div>
        <span class="text-xs font-bold tracking-wider text-zinc-500 uppercase">FocusOS Design by 曾晨阳</span>
    </div>
    <div class="text-xs text-apple-muted font-mono font-black" id="live-clock">
        正在同步时间...
    </div>
</header>

<main class="flex-1 flex flex-col md:flex-row overflow-hidden relative w-full h-full">

    <!-- ==================== LEFT HALF: CALENDAR SYSTEM (Tab 1 on Mobile) ==================== -->
    <section id="section-calendar" class="w-full md:w-1/2 border-r border-apple-border flex flex-col h-full bg-white select-none transition-all duration-300">
        
        <!-- Apple Premium Day Picker -->
        <div class="p-4 md:p-6 border-b border-apple-border flex flex-col space-y-4 no-select flex-shrink-0 bg-white">
            <div class="flex items-center justify-between">
                <!-- Capsule Buttons for quick day toggling -->
                <div class="flex bg-zinc-100 p-1 rounded-xl border border-zinc-200/50" id="three-day-capsules">
                    <button onclick="selectRelativeDay(0)" id="btn-day-0" class="px-5 py-1.5 text-xs font-black rounded-lg transition-all duration-200 active-scale">今</button>
                    <button onclick="selectRelativeDay(1)" id="btn-day-1" class="px-5 py-1.5 text-xs font-black rounded-lg transition-all duration-200 active-scale">明</button>
                    <button onclick="selectRelativeDay(2)" id="btn-day-2" class="px-5 py-1.5 text-xs font-black rounded-lg transition-all duration-200 active-scale">后</button>
                </div>
                
                <!-- Free Date Selector / Input Overlay (Works universally) -->
                <div class="relative cursor-pointer hover:opacity-80 transition-opacity flex items-center space-x-1 py-1.5 px-3 rounded-lg hover:bg-zinc-50">
                    <h2 class="text-sm md:text-base font-black tracking-tight text-apple-darkText flex items-center space-x-1.5">
                        <i class="fa-regular fa-calendar-check text-blue-500"></i>
                        <span id="date-label">正在载入日期...</span>
                    </h2>
                    <i class="fa-solid fa-angle-down text-zinc-400 text-xs mt-0.5"></i>
                    <!-- Transparent Input overlays completely to bypass iframe sandbox blockages -->
                    <input type="date" id="hidden-date-picker" class="absolute inset-0 w-full h-full opacity-0 pointer-events-auto cursor-pointer z-10" onchange="onDatePickerChange(this)">
                </div>
            </div>
        </div>

        <!-- Google Calendar style Scrollable Timeline Container -->
        <div class="flex-1 overflow-y-auto relative bg-gradient-to-b from-white to-zinc-50/40" id="timeline-container" style="-webkit-overflow-scrolling: touch;">
            <!-- Real Grid Height: 1248px (24 hours * 52px) -->
            <div class="relative w-full cursor-crosshair select-none" id="timeline-grid" style="height: 1248px;">
                
                <!-- Absolute Grid Lines Container (No overlapping or layout shift errors) -->
                <div class="absolute inset-0 pointer-events-none" id="grid-lines">
                    <!-- JS will absolute-position 24 lines precisely -->
                </div>
                
                <!-- Elegantly animated Drag Preview Frame -->
                <div id="drag-preview" class="absolute left-16 right-4 rounded-xl border-2 border-dashed border-blue-400 bg-blue-50/60 pointer-events-none hidden flex flex-col justify-between p-3 z-20 shadow-lg shadow-blue-500/5">
                    <div class="flex items-center space-x-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>
                        <span id="drag-preview-title" class="text-[11px] font-bold text-blue-600 font-sans">框选创建日程...</span>
                    </div>
                    <span id="drag-preview-time" class="text-xs font-mono font-black text-blue-500">00:00 - 00:00</span>
                </div>
                
                <!-- Active events overlay (Pointer events none, allowing clicks to pass to grid) -->
                <div class="absolute inset-y-0 right-0 left-16 pointer-events-none z-10" id="events-overlay">
                    <!-- Absolute-positioned blocks with pointer-events-auto -->
                </div>

                <!-- Real-time current time indicator (Google Calendar style red line) -->
                <div id="current-time-indicator" class="absolute left-0 right-0 pointer-events-none z-20 hidden h-[1px]">
                    <div class="absolute left-[60px] w-2 h-2 rounded-full bg-rose-500 -translate-x-1/2 -translate-y-[3.5px] shadow-sm shadow-rose-500/30"></div>
                    <div class="ml-16 mr-2 border-t border-rose-500"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- ==================== RIGHT HALF: OVERVIEW & CONTROLS (Tab 2 & 3 on Mobile) ==================== -->
    <section id="section-right" class="w-full md:w-1/2 flex flex-col h-full bg-apple-light overflow-hidden transition-all duration-300">
        
        <!-- Right Top Half - Points & Timer (Tab 2 on Mobile) -->
        <div id="panel-focus" class="h-1/2 border-b border-apple-border p-6 md:p-8 flex flex-col justify-between bg-white/40 overflow-y-auto md:overflow-visible">
            <!-- Giant Score Display -->
            <div class="flex flex-col items-center justify-center py-4 text-center flex-shrink-0">
                <span class="text-[10px] tracking-widest text-apple-muted font-bold uppercase mb-1">TOTAL INTEGRAL · 累计总积分</span>
                <div class="flex items-baseline space-x-1.5">
                    <span class="text-5xl md:text-6xl font-black tracking-tight text-apple-darkText font-sans transition-all duration-300 ease-out" id="points-display">
                        0

                    <span class="text-xs font-black text-zinc-400 font-mono">PTS</span>
                </div>
                <!-- Dynamic per-day statistics linked with calendar's selected day -->
                <div class="mt-3 flex items-center space-x-4 text-xs text-zinc-500 font-bold">
                    <span id="points-earned-day" class="flex items-center"><i class="fa-solid fa-arrow-trend-up text-emerald-500 mr-1.5"></i>今日获得: +0</span>
                    <span class="w-1 h-1 rounded-full bg-zinc-300"></span>

            </div>

            <!-- Focus vs Play grid panels -->
            <div class="grid grid-cols-2 gap-4 mt-2">
                <!-- STUDY CARD -->
                <div id="card-study" class="bg-white border border-apple-border rounded-2xl p-4 flex flex-col justify-between transition-all duration-300 relative overflow-hidden group hover:shadow-sm">
                    <div id="pulse-study" class="absolute inset-0 bg-blue-500/5 opacity-0 pointer-events-none transition-all duration-300"></div>
                    <div class="flex justify-between items-start z-10">
                        <div class="p-2 bg-blue-50 rounded-xl text-blue-600">
                            <i class="fa-solid fa-graduation-cap text-base"></i>
                        </div>
                        <span class="text-[9px] md:text-[10px] font-mono font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">
                            +1 分/分
                        </span>
                    </div>
                    
                    <div class="mt-4 z-10">

                        <p class="text-[11px] text-apple-muted mt-0.5" id="timer-study-desc">待开启专注</p>

                        <i class="fa-solid fa-play text-[10px]"></i>
                        <span>开始学习</span>
                    </button>
                </div>

                <!-- PLAY CARD -->
                <div id="card-play" class="bg-white border border-apple-border rounded-2xl p-4 flex flex-col justify-between transition-all duration-300 relative overflow-hidden group hover:shadow-sm">
                    <div id="pulse-play" class="absolute inset-0 bg-rose-500/5 opacity-0 pointer-events-none transition-all duration-300"></div>
                    <div class="flex justify-between items-start z-10">
                        <div class="p-2 bg-rose-50 rounded-xl text-rose-600">
                            <i class="fa-solid fa-gamepad text-base"></i>
                        </div>
                        <span class="text-[9px] md:text-[10px] font-mono font-black text-rose-600 bg-rose-50 px-2 py-0.5 rounded-md">
                            -5 分/分
                        </span>
                    </div>
                    
                    <div class="mt-4 z-10">
                        <h4 class="text-xs md:text-sm font-black text-zinc-800">娱乐放松</h4>
                        <p class="text-[11px] text-apple-muted mt-0.5" id="timer-play-desc">待开启放松</p>
                        <div class="text-xl md:text-2xl font-mono font-black text-rose-600 mt-1 hidden" id="timer-play-display">00:00</div>
                    </div>

                    <button id="btn-play" onclick="toggleTracker('play')" class="mt-3.5 w-full py-2.5 rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-800 text-xs md:text-sm font-black transition-all duration-200 z-10 flex items-center justify-center space-x-1.5 active-scale">
                        <i class="fa-solid fa-play text-[10px]"></i>
                        <span>开始放松</span>
                    </button>

            </div>
        </div>

        <!-- Right Bottom Half - Memo Slate (Tab 3 on Mobile) -->
        <div id="panel-memo" class="h-1/2 p-6 md:p-8 flex flex-col justify-between bg-white/20">
            <div class="flex items-center justify-between mb-3 no-select flex-shrink-0">
                <h3 class="text-xs font-black tracking-wider text-zinc-500 uppercase flex items-center space-x-2">
                    <i class="fa-regular fa-note-sticky text-amber-500"></i>

            <div class="flex-1 relative">
                <textarea id="memo-textarea" placeholder="在此处记下今天的感悟、长期规划或系统待办..." class="w-full h-full bg-white border border-apple-border rounded-xl p-4 text-[16px] md:text-sm text-zinc-800 placeholder-zinc-400 shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500/20 focus:border-blue-500/50 resize-none leading-relaxed transition-all duration-200" style="-webkit-overflow-scrolling: touch;"></textarea>
            </div>
        </div>
    </section>
</main>

<!-- ==================== CORE JAVA SCRIPT BUSINESS LOGIC ==================== -->
<script>
// Core Application State
let state = {
    selectedDate: new Date(), 
    points: 0,                // Global persistent lifetime cumulative score
    dailyStats: {},          // Indexed by 'YYYY-MM-DD' -> { earned: 0, spent: 0 }
    schedules: {},           // Indexed by Date string 'YYYY-MM-DD'
    activeTracker: {          // Persisted active tracker to survive tab sleep/refresh
        type: null,
        startTime: null,
        pointsAtStart: null,
        earnedAtStart: null,
        spentAtStart: null,
        dateKey: null
    },
    memo: "",
    activeMobileTab: 'calendar' // 'calendar' | 'focus' | 'memo'
};

// Tracking coordinates for dragging (Fully optimized for desktop + mobile)
let isDragging = false;
let dragStartHour = null;
let dragEndHour = null;

// Convert Date object to YYYY-MM-DD safely
function getYYYYMMDD(dateObj) {
    return dateObj.toLocaleDateString('sv'); 
}

// Convert absolute hour decimal to precise text (Fixed 60 mins bug)
function decimalToTimeStr(decimal) {
    let h = Math.floor(decimal);
    let m = Math.round((decimal - h) * 60);
    if (m === 60) {
        h += 1;
        m = 0;
    }
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// Convert YYYY-MM-DD to beautiful Apple Header Format
function getDisplayDateString(dateObj) {
    const months = dateObj.getMonth() + 1;
    const date = dateObj.getDate();
    const dayOfWeek = ['周日','周一','周二','周三','周四','周五','周六'][dateObj.getDay()];
    return `${months}月${date}日 (${dayOfWeek})`;
}

// Local Storage persist methods
function saveStateToLocalStorage() {
    localStorage.setItem('zenfocus_state_v5_premium', JSON.stringify({
        points: state.points,
        dailyStats: state.dailyStats,
        schedules: state.schedules,
        memo: state.memo,
        activeTracker: state.activeTracker
    }));
}

function loadStateFromLocalStorage() {
    const stored = localStorage.getItem('zenfocus_state_v5_premium');
    if (stored) {
        try {
            const parsed = JSON.parse(stored);
            state.points = parsed.points || 0;
            state.dailyStats = parsed.dailyStats || {};
            state.schedules = parsed.schedules || {};
            state.memo = parsed.memo || "";
            state.activeTracker = parsed.activeTracker || { type: null, startTime: null, pointsAtStart: null, earnedAtStart: null, spentAtStart: null, dateKey: null };
        } catch (e) {
            console.error("Local Storage restoration corrupted, bypassing safely.", e);
        }
    }
}

// Multi-device Viewport Swapper: Eliminates layout compression on mobile!
function switchMobileTab(tab) {
    state.activeMobileTab = tab;
    updateLayoutForTabs();
}

function updateLayoutForTabs() {
    const isMobile = window.innerWidth < 768;
    
    const sectionCalendar = document.getElementById('section-calendar');
    const sectionRight = document.getElementById('section-right');
    const panelFocus = document.getElementById('panel-focus');
    const panelMemo = document.getElementById('panel-memo');
    
    const btnNavCalendar = document.getElementById('nav-btn-calendar');
    const btnNavFocus = document.getElementById('nav-btn-focus');
    const btnNavMemo = document.getElementById('nav-btn-memo');

    if (!isMobile) {

// Convert string formatted time to precise float hours for heights
function timeToPixels(timeStr) {
    const parts = timeStr.split(':');
    const hours = parseInt(parts[0], 10);
    const minutes = parseInt(parts[1], 10);
    const totalHours = hours + (minutes / 60);
    return totalHours * 52;
}

// Interactive Scheduler drag and tap controller (Completely unifies desktop and mobile)
function initInteractiveScheduleEngine() {
    const grid = document.getElementById('timeline-grid');

    // 1. DESKTOP MOUSE EVENTS
    grid.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || e.target.closest('.pointer-events-auto')) return;
        
        const rect = grid.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        if (clickX < 64) return; // Ignore dragging on the left label track

        const y = e.clientY - rect.top;
        const hourDecimal = y / 52;
        
        dragStartHour = Math.max(0, Math.min(23.75, Math.round(hourDecimal * 4) / 4));
        dragEndHour = dragStartHour;
        isDragging = true;
        
        updateDragPreview();
        
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);
    });

    function handleMouseMove(e) {
        if (!isDragging) return;
        const rect = grid.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const hourDecimal = y / 52;
        
        dragEndHour = Math.max(0, Math.min(24, Math.round(hourDecimal * 4) / 4));
        updateDragPreview();
    }

    function handleMouseUp(e) {
        if (!isDragging) return;
        isDragging = false;
        
        window.removeEventListener('mousemove', handleMouseMove);
        window.removeEventListener('mouseup', handleMouseUp);
        
        finalizeDragSelection();
    }

    // 2. MOBILE TOUCH EVENTS - Direct drag-to-create with Scroll Zone
    grid.addEventListener('touchstart', (e) => {
        if (e.target.closest('.pointer-events-auto')) return;

        const touch = e.touches[0];
        const rect = grid.getBoundingClientRect();
        const clickX = touch.clientX - rect.left;

        // If touching on the left 64px axis, let standard scrolling happen!
        if (clickX < 64) {
            return; 
        }

        // If touching on the grid area, lock scrolling and start drawing!
        e.preventDefault(); 
        const y = touch.clientY - rect.top;
        const hourDecimal = y / 52;

        dragStartHour = Math.max(0, Math.min(23.75, Math.round(hourDecimal * 4) / 4));
        dragEndHour = dragStartHour;
        isDragging = true;

        updateDragPreview();
    }, { passive: false });

    grid.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        e.preventDefault(); // Keep locked on drawing

        const touch = e.touches[0];
        const rect = grid.getBoundingClientRect();
        const y = touch.clientY - rect.top;
        const hourDecimal = y / 52;

        dragEndHour = Math.max(0, Math.min(24, Math.round(hourDecimal * 4) / 4));
        updateDragPreview();
    }, { passive: false });

    grid.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        finalizeDragSelection();
    });
}

function updateDragPreview() {
    const preview = document.getElementById('drag-preview');
    preview.classList.remove('hidden');
    
    let start = Math.min(dragStartHour, dragEndHour);
    let end = Math.max(dragStartHour, dragEndHour);
    
    const topPx = start * 52;
    const heightPx = Math.max((end - start) * 52, 12);
    
    preview.style.top = `${topPx}px`;
    preview.style.height = `${heightPx}px`;
    
    const startTimeStr = decimalToTimeStr(start);
    const endTimeStr = decimalToTimeStr(end);
    document.getElementById('drag-preview-time').innerText = `${startTimeStr} - ${endTimeStr}`;
}

function finalizeDragSelection() {
    document.getElementById('drag-preview').classList.add('hidden');
    
    let start = Math.min(dragStartHour, dragEndHour);
    let end = Math.max(dragStartHour, dragEndHour);
    
    // Auto scale to 1 hour if just a tap
    if (end - start < 0.25) {
        end = start + 1.0;
        if (end > 24) {
            end = 24;
            start = 23;
        }
    }
    
    const startTimeStr = decimalToTimeStr(start);
    const endTimeStr = decimalToTimeStr(end);
    openModalWithRange(startTimeStr, endTimeStr);
}

function openModalWithRange(startStr, endStr) {
    document.getElementById('form-start').value = startStr;
    document.getElementById('form-end').value = endStr;

function saveSchedule(e) {
    e.preventDefault();
    const title = document.getElementById('form-title').value;
    const startTime = document.getElementById('form-start').value;
    const endTime = document.getElementById('form-end').value;
    
    if (startTime >= endTime) {
        showToast('规则错误', '结束时间必须晚于开始时间。', 'warning');
        return;
    }

    const typeNode = document.querySelector('input[name="type-color"]:checked');
    const color = typeNode ? typeNode.value : 'blue';
    let customPoints = 0;
    if (color === 'green') {
        customPoints = parseInt(document.getElementById('form-custom-points').value, 10) || 0;
    }

    const newEvent = {
        id: 'evt_' + Date.now(),
        title,
        start: startTime,
        end: endTime,
        color,
        customPoints,
        completed: false
    };

    const dateKey = getYYYYMMDD(state.selectedDate);
    if (!state.schedules[dateKey]) {
        state.schedules[dateKey] = [];
    }
    
    state.schedules[dateKey].push(newEvent);
    saveStateToLocalStorage();
    renderEvents();
    closeModal();
    showToast('日程已创建', `"${title}" 已经精准排入计划。`, 'success');
}

// Event block renderer
function renderEvents() {
    const container = document.getElementById('events-overlay');
    container.innerHTML = '';

    const dateKey = getYYYYMMDD(state.selectedDate);
    const list = state.schedules[dateKey] || [];
    
    list.forEach(evt => {
        const topPx = timeToPixels(evt.start);
        const endPx = timeToPixels(evt.end);
        const heightPx = Math.max(endPx - topPx, 52); // Ensure touchable target height

        const card = document.createElement('div');
        
        // pointer-events-auto intercepts clicks correctly while allowing backdrop to bypass
        card.className = `absolute left-2 right-2 rounded-xl p-3 border shadow-sm transition-all duration-300 flex flex-col justify-between overflow-hidden group pointer-events-auto ${
            evt.completed 
            ? 'opacity-55 bg-zinc-100 border-zinc-200 line-through text-zinc-400 shadow-none' 
            : getEventThemeClasses(evt.color)
        }`;
        
        card.style.top = `${topPx}px`;
        card.style.height = `${heightPx}px`;

        const mins = getDurationMinutes(evt.start, evt.end);
        let ptsHelper = "";
        if (evt.color === 'blue') ptsHelper = `+${mins} PTS`;
        else if (evt.color === 'red') ptsHelper = `-${mins * 5} PTS`;
        else ptsHelper = `${evt.customPoints >= 0 ? '+' : ''}${evt.customPoints} PTS`;

        card.innerHTML = `
            <div class="flex items-start justify-between w-full h-full">
                <!-- Left Section (checkbox & title) -->
                <div class="flex items-start space-x-3 overflow-hidden h-full">
                    <div class="flex items-center justify-center p-1">
                        <input type="checkbox" ${evt.completed ? 'checked' : ''} onclick="toggleEventCompletion('${evt.id}', event)" class="w-5 h-5 rounded border-zinc-300 text-blue-600 focus:ring-0 cursor-pointer accent-blue-600 active-scale">
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <span class="text-xs md:text-sm font-black truncate ${evt.completed ? 'text-zinc-400' : 'text-zinc-800'}">${evt.title}</span>
                        <span class="text-[11px] font-mono font-black text-zinc-600/90 mt-0.5">${evt.start} - ${evt.end} (${mins}分)</span>
                    </div>
                </div>
                
                <!-- Right Section (Value badge & Delete icon) -->
                <div class="flex flex-col items-end justify-between h-full min-w-[70px]">
                    <span class="text-[10px] font-mono font-black px-1.5 py-0.5 rounded ${evt.completed ? 'bg-zinc-200 text-zinc-400' : getBadgeThemeClasses(evt.color)}">
                        ${ptsHelper}
                    </span>
                    <button onclick="deleteEvent('${evt.id}', event)" class="opacity-100 md:opacity-0 group-hover:opacity-100 text-zinc-400 hover:text-rose-500 text-sm p-1 transition-opacity duration-150 active-scale">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function getEventThemeClasses(color) {
    switch (color) {
        case 'blue': return 'bg-blue-50 border-blue-200/80 text-blue-800 hover:bg-blue-100/60';
        case 'red': return 'bg-rose-50 border-rose-200/80 text-rose-800 hover:bg-rose-100/60';
        case 'green': return 'bg-emerald-50 border-emerald-200/80 text-emerald-800 hover:bg-emerald-100/60';
        default: return 'bg-white border-zinc-200 text-zinc-800';
    }
}

function getBadgeThemeClasses(color) {
    switch (color) {
        case 'blue': return 'bg-blue-100/80 text-blue-700';
        case 'red': return 'bg-rose-100/80 text-rose-700';
        case 'green': return 'bg-emerald-100/80 text-emerald-700';
        default: return 'bg-zinc-100 text-zinc-600';
    }
}

function getDurationMinutes(start, end) {
    const s = start.split(':');
    const e = end.split(':');
    const startMins = parseInt(s[0], 10) * 60 + parseInt(s[1], 10);
    const endMins = parseInt(e[0], 10) * 60 + parseInt(e[1], 10);
    return Math.max(endMins - startMins, 0);
}

// Complete and settle points
function toggleEventCompletion(id, event) {
    event.stopPropagation();
    const dateKey = getYYYYMMDD(state.selectedDate);
    const list = state.schedules[dateKey] || [];
    const index = list.findIndex(e => e.id === id);
    if (index === -1) return;

    const evt = list[index];
    evt.completed = !evt.completed;

    const durationMins = getDurationMinutes(evt.start, evt.end);
    let scoreDelta = 0;

    if (evt.color === 'blue') {
        scoreDelta = durationMins * 1; 
    } else if (evt.color === 'red') {
        scoreDelta = durationMins * -5; 
    } else if (evt.color === 'green') {
        scoreDelta = evt.customPoints; 
    }

    const dayStats = getDayStatsObj(dateKey);

    if (evt.completed) {
        state.points += scoreDelta;
        if (scoreDelta >= 0) {
            dayStats.earned += scoreDelta;
            showToast('成就解锁', `结算成功，增加积分 +${scoreDelta}`, 'success');
        } else {
            dayStats.spent += scoreDelta;
            showToast('放空完结', `消费成功，扣除积分 ${scoreDelta}`, 'warning');
        }
    } else {
        state.points -= scoreDelta;
        if (scoreDelta >= 0) {
            dayStats.earned -= scoreDelta;
            showToast('状态更新', `撤回已得积分 -${scoreDelta}`, 'info');
        } else {
            dayStats.spent -= scoreDelta;
            showToast('状态更新', `返还已扣积分 +${Math.abs(scoreDelta)}`, 'info');
        }
    }

    saveStateToLocalStorage();
    renderEvents();
    updatePointsUI();
}

function deleteEvent(id, event) {
    event.stopPropagation();
    const dateKey = getYYYYMMDD(state.selectedDate);
    const list = state.schedules[dateKey] || [];
    const index = list.findIndex(e => e.id === id);
    if (index === -1) return;

    const evt = list[index];
    if (evt.completed) {
        const durationMins = getDurationMinutes(evt.start, evt.end);
        let scoreDelta = 0;
        if (evt.color === 'blue') scoreDelta = durationMins * 1;
        else if (evt.color === 'red') scoreDelta = durationMins * -5;
        else if (evt.color === 'green') scoreDelta = evt.customPoints;

        const dayStats = getDayStatsObj(dateKey);

        state.points -= scoreDelta;
        if (scoreDelta >= 0) dayStats.earned -= scoreDelta;
        else dayStats.spent -= scoreDelta;
    }

    list.splice(index, 1);
    saveStateToLocalStorage();
    renderEvents();
    updatePointsUI();
    showToast('日程撤销', '事项已成功从计划表移除', 'info');
}

// Stopwatch logic: Time-Delta calculations to handle screen lock & sleep seamlessly
let trackerInterval = null;

function startTrackerInterval() {
    if (trackerInterval) clearInterval(trackerInterval);
    trackerInterval = setInterval(() => {
        updateActiveTrackerUI();
    }, 200); // Super-responsive tick rate
}

function updateActiveTrackerUI() {
    const tracker = state.activeTracker;
    if (!tracker || !tracker.type) return;

    const type = tracker.type;
    // High Precision Time-Delta: Uses system epoch rather than standard setInterval count
    const elapsedSeconds = Math.floor((Date.now() - tracker.startTime) / 1000);
    
    // Dynamic timer text update
    const displayMin = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
    const displaySec = String(elapsedSeconds % 60).padStart(2, '0');
    const timerDisplay = document.getElementById(`timer-${type}-display`);
    if (timerDisplay) {
        timerDisplay.innerText = `${displayMin}:${displaySec}`;
    }

    // Apply point calculations live using absolute delta formula
    const dayStats = getDayStatsObj(tracker.dateKey);
    let delta = 0;
    
    if (type === 'study') {
        delta = elapsedSeconds * (1 / 60);
        dayStats.earned = tracker.earnedAtStart + delta;
    } else {
        delta = elapsedSeconds * (-5 / 60);
        dayStats.spent = tracker.spentAtStart + delta;
    }
    
    state.points = tracker.pointsAtStart + delta;
    
    // Render updated status real-time
    updatePointsUI();
}

function toggleTracker(type) {
    if (state.activeTracker && state.activeTracker.type) {
        const activeType = state.activeTracker.type;
        if (activeType === type) {
            // If clicked the running one, stop it
            stopActiveTracker();
        } else {
            // If clicked the other one, swap them seamlessly
            stopActiveTracker();
            startTracker(type);
        }
    } else {
        // Nothing is running, standard boot up
        startTracker(type);
    }
}

function startTracker(type) {
    const todayStr = getYYYYMMDD(new Date());
    const dayStats = getDayStatsObj(todayStr);

    // Snapshot current stats to establish absolute starting point
    state.activeTracker = {
        type: type,
        startTime: Date.now(),
        pointsAtStart: state.points,
        earnedAtStart: dayStats.earned,
        spentAtStart: dayStats.spent,
        dateKey: todayStr
    };

    // Activate styling and breathing pulse classes
    document.getElementById(`pulse-${type}`).classList.remove('opacity-0');
    document.getElementById(`pulse-${type}`).classList.add('opacity-100');
    document.getElementById(`card-${type}`).classList.add(type === 'study' ? 'border-blue-400' : 'border-rose-400');
    document.getElementById(`timer-${type}-display`).classList.remove('hidden');
    document.getElementById(`timer-${type}-desc`).innerText = "全力进行中...";
    
    const btn = document.getElementById(`btn-${type}`);
    btn.innerHTML = `<i class="fa-solid fa-stop text-[10px]"></i> <span>停止计时</span>`;
    btn.className = "mt-3.5 w-full py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white text-xs md:text-sm font-black transition-all duration-200 z-10 flex items-center justify-center space-x-1.5 shadow-sm active-scale";

    startTrackerInterval();
    saveStateToLocalStorage();
    
    showToast(type === 'study' ? '专注通道已开启' : '娱乐放松中', '已为您配置息屏高精后台同步。', 'success');
}

function stopActiveTracker() {
    const tracker = state.activeTracker;
    if (!tracker || !tracker.type) return;

    const type = tracker.type;
    clearInterval(trackerInterval);

    // Complete final accurate render calculation to prevent precision loss
    updateActiveTrackerUI();

    const elapsedSeconds = Math.floor((Date.now() - tracker.startTime) / 1000);
    const finalMins = Math.round(elapsedSeconds / 60);
    let totalImpact = 0;
    if (type === 'study') {
        totalImpact = Math.round(elapsedSeconds / 60 * 1);
    } else {
        totalImpact = Math.round(elapsedSeconds / 60 * -5);
    }

    // Restore clean iOS elements
    document.getElementById(`pulse-${type}`).classList.remove('opacity-100');
    document.getElementById(`pulse-${type}`).classList.add('opacity-0');
    document.getElementById(`card-${type}`).classList.remove('border-blue-400', 'border-rose-400');
    document.getElementById(`timer-${type}-display`).classList.add('hidden');
    document.getElementById(`timer-${type}-desc`).innerText = "待开启计时";

    const btn = document.getElementById(`btn-${type}`);
    btn.innerHTML = `<i class="fa-solid fa-play text-[10px]"></i> <span>开始${type === 'study' ? '学习' : '放松'}</span>`;
    btn.className = "mt-3.5 w-full py-2.5 rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-800 text-xs md:text-sm font-black transition-all duration-200 z-10 flex items-center justify-center space-x-1.5 active-scale";

    // Decommission current tracker
    state.activeTracker = { type: null, startTime: null, pointsAtStart: null, earnedAtStart: null, spentAtStart: null, dateKey: null };

    saveStateToLocalStorage();
    updatePointsUI();

    showToast(
        '计时里程已保存', 
        `本次持续了 ${finalMins} 分钟。数值波动：${totalImpact >= 0 ? '+' : ''}${totalImpact} PTS`, 
        type === 'study' ? 'success' : 'warning'
    );
}

function resumeActiveTracker() {
    const tracker = state.activeTracker;
    if (!tracker || !tracker.type) return;

    const type = tracker.type;

    // Restore active UI styles
    document.getElementById(`pulse-${type}`).classList.remove('opacity-0');
    document.getElementById(`pulse-${type}`).classList.add('opacity-100');
    document.getElementById(`card-${type}`).classList.add(type === 'study' ? 'border-blue-400' : 'border-rose-400');
    document.getElementById(`timer-${type}-display`).classList.remove('hidden');
    document.getElementById(`timer-${type}-desc`).innerText = "全力进行中...";
    
    const btn = document.getElementById(`btn-${type}`);
    btn.innerHTML = `<i class="fa-solid fa-stop text-[10px]"></i> <span>停止计时</span>`;
    btn.className = "mt-3.5 w-full py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white text-xs md:text-sm font-black transition-all duration-200 z-10 flex items-center justify-center space-x-1.5 shadow-sm active-scale";

    startTrackerInterval();
}

// Instantly catch up on background wake-up or tab activation
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        if (state.activeTracker && state.activeTracker.type) {
            updateActiveTrackerUI();
        }
    }
});

// Slate Autosave
function initMemoController() {
    const memo = document.getElementById('memo-textarea');
    memo.value = state.memo;
    
    let typingTimer;
    memo.addEventListener('input', () => {
        const status = document.getElementById('note-status');
        status.innerText = "正在静默存盘...";
        
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            state.memo = memo.value;
            saveStateToLocalStorage();
            status.innerText = "已自动保存在本地";
        }, 800);
    });
}

// Window Loader Bootstraps
window.onload = function() {
    loadStateFromLocalStorage();
    initClock();
    selectNewDate(new Date()); 
    initInteractiveScheduleEngine();
    initMemoController();
    resumeActiveTracker(); // Seamless restoration of active sessions
    
    // Refresh display
    updateLayoutForTabs();

    // Auto-update current time indicator every 30 seconds
    setInterval(updateCurrentTimeIndicator, 30000);
}
</script>
